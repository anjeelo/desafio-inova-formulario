<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Inscrição</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container_principal">
        <section class="secao_formulario">
            <div class="secao_formulario__cabecalho">
                <h1 class="secao_formulario__h1">Formulário de inscrição</h1>
                <p class="secao_formulario__paragrafo">
                    Preencha os dados abaixo para fazer sua inscrição no Programa Trilhas.
                </p>
                <h2 class="secao_formulario__h2">Informações do participante</h2>
            </div>

            <form id="formulario">
                <div class="div_input">
                    <label for="nomecompleto">Nome completo</label>
                    <input type="text" id="nomecompleto" placeholder="Maria Silva" required>
                </div>

                <div class="div_input">
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date" id="data_nascimento" required>
                </div>

                <div class="div_input">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" maxlength="14" placeholder="123.456.789-00" required>
                </div>

                <div class="div_input">
                    <label for="sexo">Sexo</label>
                    <select id="sexo" required>
                        <option value="" disabled selected>Selecione</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Não Binário">Não Binário</option>
                        <option value="Prefiro não dizer">Prefiro não dizer</option>
                    </select>
                </div>

                <div class="div_input">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
                    <span class="span_erro" style="display: none;">Insira um e-mail válido</span>
                </div>

                <div class="div_input">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>
                    <span class="span_erro" style="display: none;">Insira um número de telefone válido</span>
                </div>

                <div class="checkbox_termos">
                    <label>
                        <input type="checkbox" required>
                        <span>Declaro que li e concordo com os <strong><a href="#" class="termosecondicoes">Termos e Condições</a></strong> e com a <strong><a href="#" class="termosecondicoes">Política de Privacidade</a></strong>.</span>
                    </label>
                </div>

                <div class="botoes">
                    <button type="reset" class="cancelar">Cancelar</button>
                    <button type="submit" class="enviar">Fazer inscrição</button>
                </div>
            </form>
        </section>

        <section class="img_formulario">
            <img src="img/pagina.png" alt="Ilustração" class="img-ilustracao">
            <img src="img/logo.png" alt="Logo Trilhas" class="imglogo">
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
